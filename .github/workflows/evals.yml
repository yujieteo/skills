name: Evals

# Paid model evals. Run by hand from the Actions tab; needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which evals to run
        type: choice
        options: [triggers, behavior, both]
        default: both
      skill:
        description: Limit behavior evals to one skill (optional)
        required: false
      baseline:
        description: Also run behavior cases without the skill
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evals:
    name: Run skill evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-sharpening/evals
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Check eval files
        run: node run.mjs check
      - name: Trigger evals
        if: inputs.suite != 'behavior'
        run: node run.mjs triggers
      - name: Behavior evals
        if: ${{ !cancelled() && inputs.suite != 'triggers' }}
        run: node run.mjs behavior ${{ inputs.skill && format('--skill {0}', inputs.skill) || '' }} ${{ inputs.baseline && '--baseline' || '' }}
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: skill-sharpening/evals/results/
