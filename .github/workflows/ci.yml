name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collection:
    name: Validate skills collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collection structure
        run: node skill-sharpening/scripts/verify-collection.mjs
      - name: Validate eval files
        run: node skill-sharpening/evals/run.mjs check
      - name: Test the linter
        run: node --test skill-sharpening/scripts/verify-collection.test.mjs
      - name: Test the type-check summary
        run: node --test skill-sharpening/scripts/typecheck.test.mjs

  typecheck:
    name: Type-check JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned TypeScript, and the eval runner's SDK for its types
        run: npm ci && npm ci --prefix skill-sharpening/evals
      - name: Type check
        run: npm run typecheck

  poteto-tools:
    name: Test Poteto Mode tools
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poteto-mode/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test orch watch-pr
      - name: Type check
        run: bun run typecheck
